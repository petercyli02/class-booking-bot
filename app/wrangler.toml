name = "class-watch"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# UI files in ./public are served directly; /api/* falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Check watched classes every minute (free plan allows this).
[triggers]
crons = ["* * * * *"]

# Create with: npx wrangler kv namespace create WATCH_KV  -> paste the id here.
[[kv_namespaces]]
binding = "WATCH_KV"

id = "5fb7bc4b4141463abd3d0d3e8d253fac"

# Secrets (Worker > Settings > Variables and Secrets, type Secret - not in this file):
#   ACCESS_KEY          - passphrase the UI needs to change watches/settings
#   TELEGRAM_BOT_TOKEN  - from @BotFather
#   TELEGRAM_CHAT_ID    - Settings > "Find chat ID" in the UI
#   RESEND_API_KEY      - from resend.com (email)
#   EMAIL_FROM          - optional; defaults to classwatch <onboarding@resend.dev>
